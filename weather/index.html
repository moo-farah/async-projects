<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <title>Weather API</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Search Bar -->
    <div id="app">
    <div id="searchBar">
        <input type="text" id="searchBarInput" placeholder="Search by city">
        <button id="searchIcon"><i class="fa fa-search"
             aria-hidden="true"></i></button>
    </div>

    <!-- Date & City -->
     <div id="info">
        <p id="date"></p>
        <h3 id="city"></h3>
     </div>

     <!-- Image -->
     <div id="tempImg">

     </div>

     <!-- Description -->
      <div id="descriptiondiv"></div>

      <!-- Temp -->
       <div id="tempdiv"></div>
<!-- 
       Extra Info -->
       <div id="extraInfo">
        <div class="col">
            <div class="info">
                <h5>Highs</h5>
                <p id="tempMax"></p>
            </div>
        </div>
        <div class="col">
            <div class="info">
                <h5>Lows</h5>
                <p id="tempMin"></p>
            </div>
        </div>
       </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
